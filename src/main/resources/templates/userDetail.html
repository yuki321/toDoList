<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー詳細画面</title>
	<link th:href="@{/style/style.css}" rel="stylesheet">
	<script th:src="@{/js/index.js}" charset="utf-8"></script>
	<link href="http://fonts.googleapis.com/earlyaccess/notosansjp.css">
</head>
<body>
	<main>
		<div class="container">
			<h1>ユーザー詳細</h1>
			<div id="header-content">
				<form th:action="@{/logout}" method="post">
				    <button class="link-edit" type="submit">ログアウト</button>
				</form>			
			</div>
			<div id="detail">
				<form method="post" th:action="@{/api/users/user/{id}(id=${user.id})}" th:object="${user}">
					<p class="error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
					<table class="table">
						<tbody>
							<tr>
								<th>ユーザー名</th>
								<th>
									<input type="text" th:field="*{userName}" size="35"/>
									<span class="error" th:errors="*{userName}"></span>
								</th>
							</tr>
							<tr>
								<th>メールアドレス</th>
								<th>
									<input type="email" th:field="*{email}" size="35"/>
									<span class="error" th:errors="*{email}"></span>
								</th>
							</tr>
							<tr>
								<th>パスワード</th>
								<th>
									<a class="link-list" th:href="@{/api/users/user/{id}/change-password(id=${user?.id})}">パスワード変更</a>
								</th>
							</tr>
							<tr>
								<th>ロール</th>
								<th th:if="${user.id} != 1">
									<select th:field="*{role}">
										<option value="General">General</option>
										<option value="Admin">Admin</option>
									</select>
									<span class="error" th:errors="*{role}"></span>
								</th>
								<th th:if="${user.id} == 1"><span>Admin</span></th>
							</tr>
							<tr>
								<th>作成日時</th>
								<th><span th:text="${#temporals.format(user?.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></th>
							</tr>
							<tr>
								<th>最終更新日時</th>
								<th><span th:text="${#temporals.format(user?.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></span></th>
							</tr>		
						</tbody>
					</table>
					<a class="link-list" th:href="@{/api/users/user}">戻る</a>
					<input class="link-update" type="submit" value="更新"/>
					<input th:if="${user?.role} == 'General'"
					class="link-delete" id="delete" type="button" value="削除" onclick="onClickDeleteBtn()"/>
				</form>		
			</div>
		</div>
	</main>
	<dialog id="deleteDialog">
		<p>本当にユーザー情報を削除しますか？</p>
		<div id="dialog">
			<input class="link-list" id="closeDialog" type="button" value="キャンセル" onclick="closeUserDeleteDialog()"/>
			<form method="post" th:action="@{/api/users/user/{id}/delete(id=${user.id})}" id="delete-btn">
				<input class="link-delete" type="submit" id="delete" value="削除" />
			</form>			
		</div>
	</dialog>
	
</body>

</html>
