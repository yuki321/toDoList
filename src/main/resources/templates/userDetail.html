<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー詳細画面</title>
	<link th:href="@{/style/style.css}" rel="stylesheet">
	<script th:src="@{/js/index.js}" charset="utf-8"></script>
	<link href="http://fonts.googleapis.com/earlyaccess/notosansjp.css">
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<script th:inline="javascript">
	const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB
	const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
	const userId = /*[[${user.id}]]*/ null;
	const csrfToken = /*[[${_csrf.token}]]*/ '';
	const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';

	document.addEventListener('DOMContentLoaded', function() {
		document.getElementById('uploadBtn').addEventListener('click', async function() {
			const fileInput = document.getElementById('imageInput');
			const file = fileInput.files[0];
			const statusMsg = document.getElementById('statusMsg');
			const uploadBtn = document.getElementById('uploadBtn');

			if (!file) {
				statusMsg.textContent = 'ファイルが選択されていません。';
				return;
			}

			if (!ALLOWED_TYPES.includes(file.type)) {
				statusMsg.textContent = 'JPEG、PNG、WebP形式の画像を選択してください。';
				return;
			}

			if (file.size > MAX_FILE_SIZE) {
				statusMsg.textContent = 'ファイルサイズは5MB以下にしてください。';
				return;
			}

			const formData = new FormData();
			formData.append('file', file);
			formData.append('userId', userId);

			uploadBtn.disabled = true;
			statusMsg.textContent = 'アップロード中...';

			try {
				const response = await fetch('/api/users/user/' + userId + '/presigned-url', {
					method: 'POST',
					headers: {
						[csrfHeader]: csrfToken
					},
					body: formData
				});

				if (!response.ok) {
					statusMsg.textContent = 'アップロード用URLの取得に失敗しました。';
					return;
				}

				const { presignedUrl, keyName } = await response.json();
				if (!presignedUrl || !keyName) {
					statusMsg.textContent = 'アップロード用URLの取得に失敗しました。';
					return;
				}

				const uploadResponse = await fetch(presignedUrl, {
					method: 'PUT',
					headers: {
						'Content-Type': file.type
					},
					body: file
				});

				if (!uploadResponse.ok) {
					statusMsg.textContent = 'アップロード失敗';
					return;
				}

				const completeResponse = await fetch('/api/users/complete', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/x-www-form-urlencoded',
						[csrfHeader]: csrfToken
					},
					body: new URLSearchParams({
						userId: String(userId),
						keyName: keyName
					})
				});

				if (!completeResponse.ok) {
					statusMsg.textContent = '画像情報の保存に失敗しました。';
					return;
				}

				statusMsg.textContent = 'アップロード成功';
				const profileImage = document.getElementById('profile-image');
				profileImage.src = URL.createObjectURL(file);
				fileInput.value = '';
			} catch (e) {
				statusMsg.textContent = 'アップロード失敗';
			} finally {
				uploadBtn.disabled = false;
			}
		});
	});
</script>
<body>
	<main>
		<div class="container">
			<h1>ユーザー詳細</h1>
			<div id="header-content">
				<form th:action="@{/logout}" method="post">
				    <button class="link-edit" type="submit">ログアウト</button>
				</form>			
			</div>
			<div id="detail">
				<form method="post" th:action="@{/api/users/user/{id}(id=${user.id})}" th:object="${user}">
					<p class="error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
					<table class="table">
						<tbody>
							<tr>
								<th>ユーザー名</th>
								<th>
									<input type="text" th:field="*{userName}" size="35"/>
									<span class="error" th:errors="*{userName}"></span>
								</th>
							</tr>
							<tr>
								<th>メールアドレス</th>
								<th>
									<input type="email" th:field="*{email}" size="35"/>
									<span class="error" th:errors="*{email}"></span>
								</th>
							</tr>
							<tr>
								<th>パスワード</th>
								<th>
									<a class="link-list" th:href="@{/api/users/user/{id}/change-password(id=${user?.id})}">パスワード変更</a>
								</th>
							</tr>
							<tr>
								<th>ロール</th>
								<th th:if="${user.id} != 1">
									<select th:field="*{role}">
										<option value="General">General</option>
										<option value="Admin">Admin</option>
									</select>
									<span class="error" th:errors="*{role}"></span>
								</th>
								<th th:if="${user.id} == 1"><span>Admin</span></th>
							</tr>
							<tr>
								<th>ユーザー画像</th>
								<th>
									<img th:src="@{${profileImageUrl}}" alt="ユーザー画像" id="profile-image" />
									<div>
										<input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" /><br>
										<button type="button" id="uploadBtn" class="link-update">アップロード</button>
									</div>
									<p id="statusMsg"></p>
								</th>
							</tr>
							<tr>
								<th>作成日時</th>
								<th><span th:text="${#temporals.format(user?.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></th>
							</tr>
							<tr>
								<th>最終更新日時</th>
								<th><span th:text="${#temporals.format(user?.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></span></th>
							</tr>		
						</tbody>
					</table>
					<a class="link-list" th:href="@{/api/users/user?page=0}">戻る</a>
					<input class="link-update" type="submit" value="更新"/>
					<input th:if="${user?.role} == 'General'"
					class="link-delete" id="delete" type="button" value="削除" onclick="onClickDeleteBtn()"/>
				</form>		
			</div>
		</div>
	</main>
	<dialog id="deleteDialog">
		<p>本当にユーザー情報を削除しますか？</p>
		<div id="dialog">
			<input class="link-list" id="closeDialog" type="button" value="キャンセル" onclick="closeUserDeleteDialog()"/>
			<form method="post" th:action="@{/api/users/user/{id}/delete(id=${user.id})}" id="delete-btn">
				<input class="link-delete" type="submit" id="delete" value="削除" />
			</form>			
		</div>
	</dialog>
</body>
</html>
