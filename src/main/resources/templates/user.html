<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー一覧画面</title>
	<link th:href="@{/style/style.css}" rel="stylesheet">
	<link href="http://fonts.googleapis.com/earlyaccess/notosansjp.css">

</head>
<body>
	<main>
		<div class="container">
			<h1>ユーザー一覧</h1>
			<div id="header-content">
				<form th:action="@{/logout}" method="post">
				    <button class="link-edit" type="submit">ログアウト</button>
				</form>			
			</div>
			<a class="link-edit" id="userCreateBtn" th:href="@{/api/users/create(login='true')}">ユーザー作成</a><br>
			<a class="link-list" id="toDoList" th:href="@{/}" >タスク一覧</a>
			
			<!-- 検索機能 -->
			<div id="search-content">
		        <form th:action="@{/api/users/search}" method="get" th:object="${user}">
		            <div class="search-form">
						<span>ユーザー名：</span>
						<input id="searchUserName" type="text" th:field="*{userName}" size="35"/>
					</div>
					<div class="search-form">
			            <span>メールアドレス：</span>
						<input type="text" th:field="*{email}" size="35"/>
					</div>
					<div class="search-form">
			            <span>ロール：</span>
						<select th:field="*{role}">
			                <option value="">選択してください</option>
			                <option value="General">General</option>
			                <option value="Admin">Admin</option>
			            </select><br>
					</div>
					<div class="search-form">
			            <input id="searchBtn" class="link-edit" type="submit" value="検索"/>
					</div>
		        </form>
				<a class="link-list" th:href="@{/api/users/user?page=0}">リセット</a>
		    </div>
			<div id="content">
				<div th:if="${display}" class="userCountDisplay">
					<div class="userCount">データ全 <span th:text="${userCount}"></span> 件（
						<span th:text="${topIndex}"></span>~
						<span th:if="${not pages.last}" th:text="${lastIndex}"></span>
						<span th:if="${pages.last}" th:text="${userCount}"></span>件目 ）
					</div>
				</div>
				<form class="csvDownload" th:action="@{/api/users/download}" method="post">
					<button class="link-edit" type="submit">CSVダウンロード</button>
				</form>
				<div th:unless="${#lists.isEmpty(users)}">
					<table class="table">
						<thead>
							<tr>
								<th></th>
								<th>ユーザー名</th>
								<th>メールアドレス</th>
								<th>ロール</th>
								<th>作成日時</th>
								<th>最終更新日時</th>
							</tr>
						</thead>
						<tbody th:each="user: ${users}">
							<th><a class="link-edit" th:href="@{user/{id}(id=${user?.id})}">編集</a></th>				
							<th><span th:text="${user?.userName}"></span></th>
							<th><span th:text="${user?.email}"></span></th>
							<th>
								<span th:if="${user?.role == 'Admin'}" th:text="${user?.role}" id="role-admin" class="role"></span>
								<span th:if="${user?.role == 'General'}" th:text="${user?.role}" id="role-general" class="role"></span>
							</th>
							<th><span class="time-font-size" th:text="${#temporals.format(user?.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></th>
							<th><span class="time-font-size" th:text="${#temporals.format(user?.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></span></th>	
							
						</tbody>
					</table>
					
					<!-- ページリンク -->
					<ul th:if="${display}" class="paging userCountDisplay">
						<li>
							<span class="active" th:if="${pages.first}">最初</span>
							<a th:if="${not pages.first}" th:href="@{${url}(page=0)}">最初</a>
						</li>

						<!-- 中間のページリンク -->
						<li th:each="i:${#numbers.sequence(0, pages.totalPages-1)}">
							<span class="active" th:if="${i}==${pages.number}" th:text="${i+1}"></span>
							<a th:if="${i}!=${pages.number}" th:href="@{${url}(page=${i})}">
								<span th:text="${i+1}"></span>
							</a>
						</li>

						<!-- 末尾のページリンク -->
						<li>
							<span class="active" th:if="${pages.last}">最後</span>
							<a th:if="${not pages.last}" th:href="@{${url}(page=(${pages.totalPages-1}))}">
								最後
							</a>
						</li>

					</ul>
					
					<form th:action="@{/api/users/upload}" method="post" enctype="multipart/form-data">
						<input class="link-upload" type="file" name="file" required><br>
						<button id="upload-btn" type="submit">アップロード</button>
					</form>
				</div>
				<p id="no-user" th:if="${#lists.isEmpty(users)}">該当条件のユーザーは存在しません</p>
			</div>
			
		</div>
	</main>
	
</body>
