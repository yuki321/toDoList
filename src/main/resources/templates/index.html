<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧画面</title>
	<link th:href="@{/style/todo.css}" rel="stylesheet">
	<script th:src="@{/js/index.js}" charset="utf-8"></script>
	<link href="http://fonts.googleapis.com/earlyaccess/notosansjp.css">

</head>
<body>
	<main>
		<div class="container">
			<h1>タスク一覧</h1>
			<div id="header-content">
				<form th:action="@{/logout}" method="post">
				    <button class="link-edit" type="submit">ログアウト</button>
				</form>			
			</div>
			<input class="link-edit margin-top" id="todoCreate" type="button" value="タスク作成" onclick="onClickCreateToDoBtn()"/>
			<div th:if="${role == 'Admin'}">
				<a class="link-list" id="userCreateBtn" th:href="@{/api/users/user}">ユーザー一覧</a>
			</div>
			<div id="content">
				<div>
					<p th:if="${#lists.isEmpty(todos)}">タスクは存在しません</p>
				</div>
				<!-- データありの場合 -->
				<div th:each="task: ${todos}" class="task">
					<div class="todo-content">
						<p th:text="${task.content}"></p>
						<p th:text="${task.memo}" id="memo"></p>
						<span th:if="${task.deadline == null or task.deadline == ''}" id="deadline-none">期日なし</span>
						<p id="deadline-list" th:text="${#temporals.format(task.deadline, 'M/d')}"></p>
						
						<p th:if="${task.priority == '1'}" id="priority-high" class="priority">優先度高</p>
						<p th:if="${task.priority == '2'}" id="priority-medium" class="priority">優先度中</p>
						<p th:if="${task.priority == '3'}" id="priority-low" class="priority">優先度低</p>
						<p th:if="${task.priority == null or task.priority == '' or task.priority == '0'}" id="priority-none" class="priority">優先度なし</p>						
					</div>
					<div class="btn-container">
						<form method="post" th:action="@{/complete}" id="complete-form" th:object="${todoComplete}">
							<input type="hidden" name="id" th:value="${task.id}" />
							<input class="link-list" type="submit" value="完了" th:data-id="${task.id}" />
						</form>
						<input class="link-update" type="submit" value="編集"
							th:data-id="${task.id}"
							th:data-content="${task.content}"
							th:data-memo="${task.memo}"
							th:data-deadline="${task.deadline}"
							th:data-priority="${task.priority}"
							onclick="onClickEditToDoBtn(this)"/>
						<input class="link-delete delete" type="button" value="削除" 
							th:data-id="${task.id}" 
							onclick="onClickDeleteToDoBtn(this)"/>
					</div>
				</div>

				<h2 id="complete-task">完了済みタスク</h2>				
				<div>
					<p th:if="${#lists.isEmpty(completedTodos)}" class="no-task">タスクは存在しません</p>
				</div>
				<div th:each="task: ${completedTodos}" class="task">
					<div class="todo-content completed">
						<p th:text="${task.content}"></p>						
					</div>
					
					<div class="btn-container">
						<form method="post" th:action="@{/undoTask}" th:object="${undoTask}" class="undo-task">
							<input type="hidden" name="id" th:value="${task.id}" />
							<input class="link-list undo-task" type="submit" value="元に戻す" th:data-id="${task.id}" />
						</form>
						<input class="link-delete delete" type="button" value="削除" 
							th:data-id="${task.id}" 
							onclick="onClickDeleteToDoBtn(this)"/>
					</div>
				</div>
			</div>
		</div>
	</main>
	<!-- タスク作成ダイアログ -->
	<dialog id="toDoCreateDialog">
		<div id="dialog">
			<form method="post" th:action="@{/}" th:object="${todoCreate}">
				<p class="error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>

				<p>タスクを作成します</p>
				<label>タスク名</label>
				<input id="input-create-content" type="text" th:field="*{content}" required/><br>
				<span class="error" th:errors="*{content}"></span>
				
				<label>メモ</label>
				<textarea th:field="*{memo}" rows="5" cols="40"></textarea>

				<div class="deadline-container">
					<label>期日</label>
					<input id="input-create-deadline" type="datetime-local" th:field="*{deadline}"/><br>
					<span class="error" th:errors="*{deadline}"></span>					
				</div>
				<div class="priority-container">
					<label>優先度</label>
					<select th:field="*{priority}">
						<option value="1">優先度高</option>
						<option value="2">優先度中</option>
						<option value="3">優先度低</option>
					</select>
					<span class="error" th:errors="*{priority}"></span>
				</div>
		
				<div class="buttons">
					<input class="link-list" id="closeDialog" type="button" value="キャンセル" onclick="closeToDoCreateDialog()"/>
					<input class="link-update" id="create-content-submit"
					 type="submit" value="作成" />
				 </div>
			</form>			
		</div>
	</dialog>
	<!-- タスク編集ダイアログ -->
	<dialog id="toDoEditDialog">
		<div id="dialog">
			<form method="post" th:action="@{/edit}" th:object="${todoForm}">

				<input type="hidden" name="id" id="editId" />
	            <input type="hidden" name="userId" id="editUserId" />
				
				<p>タスクを編集します</p>
				<label>タスク名</label>
				<input id="input-edit-content" type="text" th:field="*{content}" required/><br>
				<span class="error" th:errors="*{content}"></span>
				
				<label>メモ</label>
				<textarea th:field="*{memo}" rows="5" cols="40" id="input-edit-memo"></textarea>
				
				<div id="deadline-container">
				    <label for="input-edit-deadline">期日</label>
				    <input id="input-edit-deadline" type="datetime-local" th:field="*{deadline}"/><br>
				    <span class="error" th:errors="*{deadline}"></span>
				</div>
				<div class="priority-container">
					<label>優先度</label>
					<select id="input-edit-priority" th:field="*{priority}">
						<option value="1">優先度高</option>
						<option value="2">優先度中</option>
						<option value="3">優先度低</option>
					</select>
					<span class="error" th:errors="*{priority}"></span>
				</div>
				
				<div class="buttons">
					<input class="link-list" id="closeDialog" type="button" value="キャンセル" onclick="closeToDoEditDialog()"/>
					<input class="link-update" id="update-btn" type="submit" value="更新"/>
				</div>
										
			</form>			
		</div>
	</dialog>
	<!-- タスク削除ダイアログ --> 
	<dialog id="deleteDialog">
		<p>タスクを削除します</p>
		<div id="dialog">
			<input class="link-list" id="closeDialog" type="button" value="キャンセル" onclick="closeToDoDeleteDialog()"/>
			<form method="post" th:action="@{/delete}" id="delete-btn">
				<input type="hidden" name="id" id="deleteTodoId"/>
				<input class="link-delete" type="submit" id="delete" value="削除" />
			</form>			
		</div>
	</dialog>
	
</body>
</html>
