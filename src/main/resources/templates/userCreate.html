<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録画面</title>
	<link th:href="@{/style/style.css}" rel="stylesheet">
	<link href="http://fonts.googleapis.com/earlyaccess/notosansjp.css">

</head>
<body>
	<main>
		<div class="container">
			<h1>ユーザー登録</h1>
			<div id="header-content">
				<form th:action="@{/logout}" method="post">
				    <button th:if="${login} == 'true'" class="link-edit" type="submit">ログアウト</button>
				</form>			
			</div>
			<div id="create">
				<form method="post" th:action="@{/api/users/create}" th:object="${user}">
					<p class="error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
					<table class="table">
						<tbody>
							<tr>
								<th>ユーザー名</th>
								<th>
									<input type="text" th:field="*{userName}"/>
									<span class="error" th:errors="*{userName}"></span>
								</th>
							</tr>
							<tr>
								<th>メールアドレス</th>
								<th>
									<input type="email" th:field="*{email}"/>
									<span class="error" th:errors="*{email}"></span>
								</th>
							</tr>
							<tr>
								<th>パスワード</th>
								<th>
									<input type="password" th:field="*{password}"/>
									<span class="error" th:errors="*{password}"></span>
								</th>
							</tr>
							
							<!-- ログインしている場合は、ロールを選択できるようにする -->
							<tr th:if="${login} == 'true'">
								<th>ロール</th>
								<th>
									<select th:field="*{role}">
										<option value="General">General</option>
										<option value="Admin">Admin</option>
									</select>
									<span class="error" th:errors="*{role}"></span>
								</th>
								
							</tr>
							
							<!-- ログインしていない場合は、ロールをGeneralに固定する -->
							<div th:unless="${login}"></div>
								<select th:field="*{role}"
									id="no-login-user-registration" >
									<option value="General">General</option>
								</select>
								<span class="error" th:errors="*{role}"></span>
							</div>
			
						</tbody>
					</table>
					<a class="link-list" th:href="@{/api/users/user?page=0}">戻る</a>
					<input class="link-update" type="submit" value="登録"/>
				</form>		
			</div>
		</div>
	</main>
</body>

</html>
